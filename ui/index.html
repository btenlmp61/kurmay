<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alpai izleme paneli</title>
<style>
:root {
  --bg:#f7f6f3; --card:#ffffff; --border:#e3e1da; --text:#2c2c2a; --muted:#8a887f;
  --blue:#185FA5; --blueBg:#E6F1FB; --teal:#0F6E56; --tealBg:#E1F5EE;
  --red:#A32D2D; --redBg:#FCEBEB; --amber:#854F0B; --amberBg:#FAEEDA;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1e1e1c; --card:#2a2a28; --border:#403f3c; --text:#e8e6e0; --muted:#93918a;
    --blue:#85B7EB; --blueBg:#0C447C; --teal:#5DCAA5; --tealBg:#085041;
    --red:#F09595; --redBg:#501313; --amber:#FAC775; --amberBg:#633806;
  }
}
* { box-sizing: border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Segoe UI", sans-serif; max-width:960px; margin-inline:auto; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:12px; }
.label { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.pill { display:inline-block; font-size:12px; padding:2px 10px; border-radius:999px; }
.hdr { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.hdr .task { font-weight:600; font-size:15px; }
.hdr .dir { margin-left:auto; font-size:12px; color:var(--muted); }
.pipe { display:flex; align-items:stretch; gap:8px; }
.pipe .arrow { align-self:center; color:var(--muted); }
.node { flex:1; text-align:center; padding:10px 6px; border-radius:8px; border:1px solid var(--border); background:transparent; }
.node .nm { font-weight:600; font-size:13px; }
.node .sub { font-size:11px; color:var(--muted); }
.node.running { background:var(--blueBg); border-color:var(--blue); }
.node.running .nm, .node.running .sub { color:var(--blue); }
.node.done { background:var(--tealBg); border-color:var(--teal); }
.node.done .nm, .node.done .sub { color:var(--teal); }
.node.rejected { background:var(--redBg); border-color:var(--red); }
.node.rejected .nm, .node.rejected .sub { color:var(--red); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
#stream { font-family:ui-monospace, Consolas, monospace; font-size:12px; line-height:1.9; max-height:340px; overflow-y:auto; }
#stream .t { color:var(--muted); margin-right:8px; }
#stream .muted { color:var(--muted); }
#stream .ok { color:var(--teal); }
#stream .err { color:var(--red); }
#stream .warn { color:var(--amber); }
.issue { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; font-size:13px; }
.sev { font-size:11px; padding:1px 8px; border-radius:999px; white-space:nowrap; }
.sev.low { background:var(--amberBg); color:var(--amber); }
.sev.medium, .sev.high { background:var(--redBg); color:var(--red); }
#approval { border-color:var(--amber); }
#approval pre { white-space:pre-wrap; font-size:12px; max-height:220px; overflow-y:auto; background:var(--bg); border-radius:8px; padding:10px; }
#approval .row { display:flex; gap:8px; flex-wrap:wrap; }
button { font:inherit; font-size:13px; padding:7px 16px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; }
button.primary { background:var(--teal); border-color:var(--teal); color:#fff; }
button:active { transform:scale(.98); }
input[type=text] { font:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); flex:1; min-width:200px; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="card hdr">
  <span class="task" id="task">bağlanıyor…</span>
  <span class="pill" id="status" style="background:var(--blueBg);color:var(--blue)">bekleniyor</span>
  <span class="pill" id="provider" style="background:var(--bg);color:var(--muted)"></span>
  <span class="pill" id="cycle" style="background:var(--bg);color:var(--muted)"></span>
  <span class="dir" id="dir"></span>
</div>

<div class="card hidden" id="taskCard">
  <div class="label">Yeni görev</div>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="text" id="taskInput" placeholder="Örn: todo listesine filtreleme özelliği ekle">
    <button class="primary" id="btnStart">Başlat</button>
  </div>
  <div id="taskError" style="font-size:12px;color:var(--red);margin-top:6px"></div>
</div>

<div class="card">
  <div class="label">Ajan hattı</div>
  <div class="pipe" id="pipeline"></div>
</div>

<div class="card hidden" id="approval">
  <div class="label">Onay bekleniyor</div>
  <div style="font-weight:600;margin-bottom:6px" id="approvalTitle"></div>
  <pre id="approvalText"></pre>
  <div class="row">
    <button class="primary" id="btnApprove">Onayla</button>
    <button id="btnReject">Reddet</button>
    <input type="text" id="rejectComment" placeholder="Red gerekçesi (isteğe bağlı)">
  </div>
</div>

<div class="grid">
  <div class="card">
    <div class="label">Olay akışı</div>
    <div id="stream"></div>
  </div>
  <div class="card hidden" id="verdictCard">
    <div class="label">Reviewer kararı</div>
    <div style="font-weight:600;margin-bottom:8px" id="verdictHead"></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px" id="verdictSummary"></div>
    <div id="issues"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let agents = [], states = {}, finished = false;

const stateLabels = { pending: "bekliyor", running: "çalışıyor", done: "tamamlandı", rejected: "reddetti" };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function trunc(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function time(ts) { return new Date(ts).toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit", second:"2-digit" }); }

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  const map = { run:["var(--blueBg)","var(--blue)"], ok:["var(--tealBg)","var(--teal)"], err:["var(--redBg)","var(--red)"], warn:["var(--amberBg)","var(--amber)"] };
  const [bg, fg] = map[kind] || map.run;
  el.style.background = bg; el.style.color = fg;
}

function renderPipeline() {
  $("pipeline").innerHTML = agents.map((a) => {
    const st = states[a] || "pending";
    return `<div class="node ${st}"><div class="nm">${esc(a)}</div><div class="sub">${stateLabels[st]}</div></div>`;
  }).join('<div class="arrow">→</div>');
}

function addLog(ts, html, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = `<span class="t">${time(ts)}</span>${html}`;
  const s = $("stream");
  s.appendChild(div);
  s.scrollTop = s.scrollHeight;
}

function handle(e) {
  switch (e.type) {
    case "workflow_started":
      agents = e.agents;
      states = {};
      agents.forEach((a) => (states[a] = "pending"));
      $("task").textContent = e.task;
      $("provider").textContent = e.provider;
      $("dir").textContent = e.targetDir;
      $("cycle").textContent = `tur 0/${e.maxCycles}`;
      $("stream").innerHTML = "";
      $("verdictCard").classList.add("hidden");
      $("approval").classList.add("hidden");
      $("taskCard").classList.add("hidden");
      finished = false;
      setStatus("çalışıyor", "run");
      renderPipeline();
      addLog(e.ts, "iş akışı başladı");
      break;
    case "agent_started":
      states[e.agent] = "running";
      renderPipeline();
      addLog(e.ts, `<b>${esc(e.agent)}</b> başladı`);
      break;
    case "agent_text":
      addLog(e.ts, esc(trunc(e.text, 240)), "muted");
      break;
    case "tool_used":
      addLog(e.ts, `⚙ ${esc(e.tool)}`, "muted");
      break;
    case "agent_finished":
      states[e.agent] = "done";
      renderPipeline();
      addLog(e.ts, `<b>${esc(e.agent)}</b> bitti`, "ok");
      break;
    case "approval_required":
      $("approvalTitle").textContent = `${e.agent} çıktısı onayını bekliyor`;
      $("approvalText").textContent = trunc(e.output, 4000);
      $("approval").classList.remove("hidden");
      setStatus("onay bekliyor", "warn");
      addLog(e.ts, `${esc(e.agent)} onay bekliyor`, "warn");
      break;
    case "approval_resolved":
      $("approval").classList.add("hidden");
      setStatus("çalışıyor", "run");
      addLog(e.ts, `onay: ${e.approved ? "verildi" : "reddedildi"} (${e.source})${e.comment ? " — " + esc(e.comment) : ""}`, e.approved ? "ok" : "err");
      break;
    case "verdict": {
      states[e.agent] = e.approved ? "done" : "rejected";
      renderPipeline();
      $("verdictCard").classList.remove("hidden");
      const head = $("verdictHead");
      head.textContent = e.approved ? "Onaylandı" : "Reddedildi";
      head.style.color = e.approved ? "var(--teal)" : "var(--red)";
      $("verdictSummary").textContent = e.summary;
      $("issues").innerHTML = e.issues.map((i) =>
        `<div class="issue"><span class="sev ${i.severity}">${i.severity}</span><span>${esc(i.file)} — ${esc(i.description)}</span></div>`
      ).join("") || '<div style="font-size:13px;color:var(--muted)">Sorun bildirilmedi</div>';
      addLog(e.ts, `karar: ${e.approved ? "onaylandı" : "reddedildi"}`, e.approved ? "ok" : "err");
      break;
    }
    case "cycle":
      $("cycle").textContent = `tur ${e.n}/${e.max}`;
      addLog(e.ts, `tur ${e.n}: sorunlar → ${esc(e.to)}`, "warn");
      break;
    case "workflow_finished":
      finished = true;
      setStatus("tamamlandı", "ok");
      addLog(e.ts, "iş akışı tamamlandı 🎉", "ok");
      showTaskCard();
      break;
    case "workflow_failed":
      finished = true;
      setStatus("hata", "err");
      addLog(e.ts, esc(e.error), "err");
      showTaskCard();
      break;
  }
}

async function sendApproval(approved) {
  const comment = $("rejectComment").value;
  await fetch("/approval", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ approved, comment: approved ? undefined : comment }),
  });
  $("rejectComment").value = "";
}
$("btnApprove").addEventListener("click", () => sendApproval(true));
$("btnReject").addEventListener("click", () => sendApproval(false));

function showTaskCard() {
  $("taskCard").classList.remove("hidden");
  $("taskError").textContent = "";
  $("taskInput").focus();
}

async function startTask() {
  const task = $("taskInput").value.trim();
  if (!task) return;
  const res = await fetch("/task", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ task }),
  });
  const data = await res.json().catch(() => ({}));
  if (data.ok) {
    $("taskInput").value = "";
    $("taskError").textContent = "";
  } else {
    $("taskError").textContent = data.error || "görev başlatılamadı";
  }
}
$("btnStart").addEventListener("click", startTask);
$("taskInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") startTask(); });

let sawAnyEvent = false;
const es = new EventSource("/events");
es.onmessage = (m) => { sawAnyEvent = true; handle(JSON.parse(m.data)); };
es.onopen = () => {
  // Sunucu modunda henüz koşu yoksa görev girişini göster
  setTimeout(() => {
    if (!sawAnyEvent) { $("task").textContent = "görev bekleniyor"; setStatus("hazır", "ok"); showTaskCard(); }
  }, 400);
};
es.onerror = () => {
  if (finished) { es.close(); $("taskCard").classList.add("hidden"); return; }
  setStatus("bağlantı koptu", "err");
};
</script>
</body>
</html>
