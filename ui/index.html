<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaver izleme paneli</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/theme.css">
<script>
// Kayıtlı tema tercihini stil hesaplanmadan önce uygula — aksi halde açık/koyu
// bir an için yanlış gelip (flash) sonra düzelir.
(function () {
  try {
    var t = localStorage.getItem("yaver-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
body { padding:28px; max-width:1700px; margin-inline:auto; }
.layout { display:flex; gap:20px; align-items:flex-start; }
.main { flex:1; min-width:0; }
.sidebar { flex:0 0 260px; width:260px; background:var(--md-surface-container-low); border:1px solid var(--border); border-radius:var(--md-shape-lg); padding:14px; position:sticky; top:28px; max-height:calc(100vh - 56px); overflow:auto; }
.sidebar.collapsed { flex-basis:auto; width:auto; }
.sidebar.collapsed .sidebar-body { display:none; }
.sidebar-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
.sidebar-head .label { margin:0; }
.sidebar-head button { padding:2px 9px; font-size:13px; min-height:auto; }
.sess { display:flex; align-items:center; gap:6px; padding:10px 12px; border-radius:var(--md-shape-full); cursor:pointer; border:1px solid transparent; margin-bottom:4px; position:relative; overflow:hidden; transition:background-color var(--md-motion); }
.sess:hover { background:var(--md-surface-container-high); }
.sess.active { background:var(--blueBg); color:var(--md-on-primary-container); }
.sess.active .meta { color:var(--md-on-primary-container); opacity:.75; }
.sess-main { flex:1; min-width:0; }
.sess .nm { font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess .meta { font-size:11.5px; color:var(--muted); }
.sess-new { font-weight:600; color:var(--md-primary); }
.sess-new.active { background:var(--blueBg); color:var(--md-on-primary-container); }
.sess-del { border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; padding:0 5px; border-radius:6px; opacity:0; min-height:auto; }
.sess:hover .sess-del { opacity:1; }
.sess-del:hover { color:var(--red); background:var(--redBg); }
/* Üst şerit — M3 "top app bar": diğer kartlardan daha koyu bir yüzey tonu ve
   daha belirgin gölge ile ayrışır, sayfanın geri kalanıyla aynı düz kart
   olmaktan çıkar. Başlık de headline ölçeğinde — önceki sürümde 15px'lik
   gövde metni büyüklüğündeydi ve "önemsiz" görünüyordu. */
.card.hdr { background:var(--md-surface-container-high); box-shadow:var(--md-elev-2); }
.hdr { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.hdr .task { font:var(--md-type-headline-sm); }
.hdr .dir-wrap { margin-left:auto; display:flex; align-items:center; gap:6px; }
.hdr .dir { font-size:12.5px; color:var(--muted); cursor:pointer; border-bottom:1px dashed transparent; }
.hdr .dir:hover { color:var(--blue); border-bottom-color:var(--blue); }
.hdr #dirInput { font-size:12.5px; padding:4px 10px; min-height:auto; width:260px; }
.hdr #modelSel { font-size:12.5px; padding:4px 10px; min-height:auto; width:auto; max-width:240px; }
.pipe { display:flex; align-items:stretch; gap:10px; }
.pipe .arrow { align-self:center; color:var(--muted); }
/* justify-content:center — paralel grup yan hücrelerden uzun olduğunda sıralı
   düğümler de onun boyuna gerilir; metin tepede kalmasın diye dikey ortalanır. */
.node { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:14px 8px; border-radius:var(--md-shape-md); border:1px solid var(--border); background:var(--md-surface-container-low); transition:background-color var(--md-motion), border-color var(--md-motion); }
.node .nm { font-weight:700; font-size:14px; }
.node .sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
.node.running { background:var(--blueBg); border-color:var(--blue); }
.node.running .nm, .node.running .sub { color:var(--md-on-primary-container); }
.node.done { background:var(--tealBg); border-color:var(--teal); }
.node.done .nm, .node.done .sub { color:var(--md-on-secondary-container); }
.node.rejected { background:var(--redBg); border-color:var(--red); }
.node.rejected .nm, .node.rejected .sub { color:var(--md-on-error-container); }
/* Paralel grup — dallar TEK bir hattın içinde üst üste. Sıralı düğümlerle aynı
   genişlikte bir hücre olması bilinçli: okuyan "burada üç şey aynı anda oluyor"
   görsün, üç ayrı adım sanmasın. */
.node.group { display:flex; flex-direction:column; gap:6px; padding:8px; background:var(--md-surface-container); }
.node.group > .glabel { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.node.group > .node { flex:none; padding:8px 6px; }
.node.group > .node .nm { font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
/* Ana görev başlatma butonu — M3 extended FAB: her zaman görünür elevation,
   daha büyük dokunma alanı, belirgin birincil renk. */
#btnStart { box-shadow:var(--md-elev-3); flex:none; }
#btnStart:hover { box-shadow:var(--md-elev-3); }
/* Dar ekran: sidebar sabit sütun olmaktan çıkıp üstte akar, agent hattı
   dikey adım listesine döner (yatayda 3+ kutu+ok telefon genişliğine sığmaz). */
@media (max-width:860px) {
  body { padding:16px; }
  .layout { flex-direction:column; }
  .sidebar, .sidebar.collapsed { width:100%; flex-basis:auto; position:static; max-height:none; }
  .hdr .dir-wrap { margin-left:0; width:100%; order:1; }
  .hdr #dirInput { flex:1; width:auto; }
  .pipe { flex-direction:column; }
  .pipe .arrow { transform:rotate(90deg); padding:2px 0; }
  /* Görev/red kutusu yanındaki buton dar ekranda metni sıkıştırıp taşırıyordu — alta düşsün.
     Placeholder metni dar genişlikte 2 satıra sarabiliyor — kutu tek satırlık autoGrow
     tabanına sabitliyse alt satır kırpılır; min-height'ı 2 satıra yükselt. */
  #taskCard .row textarea, #approval .row textarea { flex-basis:100%; min-width:0; min-height:64px; }
}
/* Kutu yükseklikleri ekranla ölçeklenir: küçük ekranda eski sabit değer korunur,
   büyük monitörde kendiliğinden açılır (alt sınır = eski değer, üst sınır = tavan) */
/* overflow-wrap:anywhere — uzun Windows yolları (`D:\a\b\c...`) boşluk içermediği
   için sarmıyor, kartı yatay taşırıyordu; `\` bölme fırsatı sayılmaz. */
#stream { font-family:ui-monospace, Consolas, monospace; font-size:12px; line-height:1.9; max-height:clamp(380px, 46vh, 720px); overflow-y:auto; overflow-wrap:anywhere; }
#stream .t { color:var(--muted); margin-right:8px; }
#stream .muted { color:var(--muted); }
#stream .ok { color:var(--teal); }
#stream .err { color:var(--red); }
#stream .warn { color:var(--amber); }
#stream details.structured { margin:4px 0 8px; border:1px solid var(--border); border-radius:var(--md-shape-sm); padding:6px 10px; }
#stream details.structured summary { cursor:pointer; color:var(--muted); font-size:11px; }
#stream details.structured pre { white-space:pre-wrap; margin:6px 0 2px; max-height:clamp(260px, 34vh, 520px); overflow-y:auto; }
.issue { display:flex; gap:8px; align-items:baseline; margin-bottom:6px; font-size:13px; }
.sev.low { background:var(--amberBg); color:var(--amber); }
.sev.medium, .sev.high { background:var(--redBg); color:var(--red); }
#approval, #schedule { border-color:var(--amber); }
#buildModules { flex-wrap:wrap; }
.bnode { padding:6px 12px; border-radius:var(--md-shape-md); border:1px solid var(--border); font-size:12px; background:transparent; }
.bnode.running { background:var(--blueBg); border-color:var(--blue); color:var(--blue); }
.bnode.done { background:var(--tealBg); border-color:var(--teal); color:var(--teal); }
.bnode.failed { background:var(--redBg); border-color:var(--red); color:var(--red); }
#buildLog { max-height:clamp(220px, 30vh, 460px); overflow:auto; white-space:pre-wrap; font-size:11px; margin-top:6px; }
#approvalText > pre { white-space:pre-wrap; font-size:12px; max-height:clamp(220px, 34vh, 520px); overflow-y:auto; background:var(--bg); border-radius:var(--md-shape-sm); padding:10px; }
#approval .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
/* `.hidden` (0-1-0) tek başına yukarıdaki id'li kuralı (1-1-1) yenemiyor —
   gizlenebilen satırlar için aynı özgüllükte bir kural gerekiyor */
#approval .row.hidden { display:none; }
.lead { font-size:14px; margin:0 0 12px; }
/* "Çıktı gelmedi" hissini önleyen uyarı: diff boş/kısmi geldiğinde panelin mi
   bir şey kaybettiği yoksa modelin mi boş gönderdiği bir bakışta anlaşılsın */
.notice { display:flex; gap:8px; align-items:flex-start; font-size:13px; margin:0 0 12px;
  padding:10px 12px; border-radius:var(--md-shape-sm); background:var(--amberBg); color:var(--amber);
  border:1px solid var(--amber); }
.notice code { background:transparent; font-size:12px; }
.diff-file { border:1px solid var(--border); border-radius:var(--md-shape-md); margin-bottom:10px; overflow:hidden; }
.diff-fhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; background:var(--bg); font-size:13px; }
.diff-fhead code { font-family:ui-monospace,Consolas,monospace; }
.diff-fsum { color:var(--muted); font-size:12px; }
.act.create, .act.created { background:var(--tealBg); color:var(--teal); }
.act.modify, .act.modified { background:var(--amberBg); color:var(--amber); }
.act.delete, .act.deleted { background:var(--redBg); color:var(--red); }
.hunk { padding:8px 10px; border-top:1px solid var(--border); }
.hunk .loc { font-size:11px; color:var(--muted); margin-bottom:4px; font-family:ui-monospace,Consolas,monospace; }
.hunk pre { white-space:pre-wrap; font-size:12px; margin:0; padding:6px 8px; border-radius:var(--md-shape-xs); overflow-x:auto; height:100%; }
/* before/after yan yana; tek taraf varsa (create/delete) tüm genişliği alır.
   Dar ekranda alt alta düşer — iki sütun okunmaz hale gelmesin. */
.hunk .sides { display:flex; gap:6px; align-items:stretch; }
.hunk .sides > div { flex:1; min-width:0; }
@media (max-width:900px) { .hunk .sides { flex-direction:column; } }
.hunk .before pre { background:var(--redBg); color:var(--red); }
.hunk .after pre { background:var(--tealBg); color:var(--teal); }
/* Değişen kelimeler: currentColor sayesinde tek kural iki tarafta da doğru
   rengi alır (before kırmızı, after yeşil) ve koyu/açık temada çalışır.
   color-mix desteklenmezse arka plan düşer, kalın yazı yine de kalır. */
.hunk .chg { background:color-mix(in srgb, currentColor 22%, transparent); font-weight:700; border-radius:3px; }
.hunk .why { font-size:12px; color:var(--muted); margin-top:5px; }
/* Hunk yorumu: onay kartındaki diff'te her parçanın altına açılan not kutusu.
   Yorumlu parça sol kenardan işaretlenir (border-top zaten kullanımda). */
.hunk.has-cmt { box-shadow: inset 2px 0 var(--amber); }
.hunk .hcmt { margin-top:6px; }
.hunk .hcmt-toggle { font-size:11px; padding:2px 8px; min-height:auto; color:var(--muted); }
.hunk.has-cmt .hcmt-toggle { color:var(--amber); border-color:var(--amber); }
.hunk .hcmt-box { width:100%; flex:none; min-width:0; margin-top:5px; font-size:12px; }
.rawjson { margin-top:8px; }
.rawjson summary { cursor:pointer; color:var(--muted); font-size:11px; }
.rawjson pre { white-space:pre-wrap; font-size:11px; max-height:clamp(200px, 28vh, 420px); overflow-y:auto; background:var(--bg); border-radius:var(--md-shape-xs); padding:8px; margin-top:6px; }
input[type=text], textarea { flex:1; min-width:200px; }
/* Tek satır yüksekliğinde başlar, yazdıkça alta doğru büyür (autoGrow) */
textarea { resize:none; overflow-y:auto; line-height:1.45; max-height:clamp(120px, 22vh, 320px); align-self:flex-start; }
#when { align-items:center; }
#when .label { margin:0; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar collapsed" id="sidebar">
  <div class="sidebar-head">
    <span class="label">Oturumlar</span>
    <button id="btnSidebar" title="Aç / kapat">☰</button>
  </div>
  <div class="sidebar-body" id="sidebarBody">
    <div class="sess sess-new active" data-id="" id="sessNew">＋ Yeni oturum</div>
    <div id="sessionList"></div>
  </div>
</aside>
<main class="main">

<div class="card hdr">
  <span class="brand"><img class="brand-logo" src="/logo.svg" alt="">yaver</span>
  <span class="task" id="task">bağlanıyor…</span>
  <span class="pill" id="status" style="background:var(--blueBg);color:var(--blue)">bekleniyor</span>
  <span class="pill" id="provider" style="background:var(--bg);color:var(--muted)"></span>
  <span class="pill" id="cycle" style="background:var(--bg);color:var(--muted)"></span>
  <span class="dir-wrap">
    <span class="dir" id="dir" title="Değiştirmek için tıkla"></span>
    <input type="text" id="dirInput" class="hidden" placeholder="/hedef/proje/dizini">
  </span>
  <select id="modelSel" title="Model — sıradaki görevde kullanılır"></select>
  <a href="/config" style="font-size:13px;color:var(--blue);text-decoration:none">⚙ Config</a>
  <button id="btnTheme" class="icon" title="Tema değiştir"></button>
  <button id="btnCancel" class="hidden danger">Durdur</button>
</div>

<div class="card hidden" id="taskCard">
  <div class="label">Yeni görev</div>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
    <textarea id="taskInput" rows="1" placeholder="Örn: todo listesine filtreleme özelliği ekle"></textarea>
    <button class="primary" id="btnStart">Başlat</button>
  </div>
  <div id="taskCtx" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  <div id="taskError" style="font-size:12px;color:var(--red);margin-top:6px"></div>
</div>

<div class="card">
  <div class="label">Ajan hattı</div>
  <div class="pipe" id="pipeline"></div>
</div>

<div class="card hidden" id="approval">
  <div class="label">Onay bekleniyor</div>
  <div style="font-weight:600;margin-bottom:6px" id="approvalTitle"></div>
  <div id="approvalText"></div>
  <div class="row">
    <button class="primary" id="btnApprove">Onayla</button>
    <button id="btnReject">Reddet</button>
    <textarea id="rejectComment" rows="1" placeholder="Red gerekçesi (isteğe bağlı)"></textarea>
  </div>
  <div class="row" id="when" style="margin-top:8px">
    <span class="label">Ne zaman çalışsın?</span>
    <select id="whenPreset">
      <option value="0">Hemen</option>
      <option value="30m">+30 dakika</option>
      <option value="1h">+1 saat</option>
      <option value="3h">+3 saat</option>
      <option value="1d">Yarın (+1 gün)</option>
      <option value="custom">Belirli tarih/saat…</option>
    </select>
    <input type="datetime-local" id="whenCustom" class="hidden">
  </div>
</div>

<div class="card hidden" id="schedule">
  <div class="label">Zamanlandı</div>
  <div style="font-weight:600;margin-bottom:6px" id="scheduleTitle"></div>
  <div class="row">
    <button class="primary" id="btnRunNow">Şimdi çalıştır</button>
    <button id="btnCancelSchedule">İptal et</button>
  </div>
</div>

<div class="card hidden" id="buildCard">
  <div class="label">Build (modül sırası)</div>
  <div class="pipe" id="buildModules"></div>
  <details class="rawjson" style="margin-top:10px"><summary>Build çıktısı</summary><pre id="buildLog"></pre></details>
</div>

<div class="grid">
  <div class="card">
    <div class="label">Olay akışı</div>
    <div id="stream"></div>
  </div>
  <div class="card hidden" id="verdictCard">
    <!-- Tek reviewer da paralel inceleme de bu kartı doldurur — etiket nötr -->
    <div class="label">İnceleme kararı</div>
    <div style="font-weight:600;margin-bottom:8px" id="verdictHead"></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px" id="verdictSummary"></div>
    <div id="issues"></div>
  </div>
</div>

</main>
</div>

<script>
const $ = (id) => document.getElementById(id);

// Açık/koyu tema geçişi: <html data-theme> üstünde tutulur, localStorage'a
// yazılır. Değer yoksa OS tercihi (theme.css'teki prefers-color-scheme) geçerli.
function currentTheme() {
  const explicit = document.documentElement.dataset.theme;
  if (explicit === "light" || explicit === "dark") return explicit;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function renderThemeBtn() {
  const dark = currentTheme() === "dark";
  $("btnTheme").textContent = dark ? "☀️" : "🌙";
  $("btnTheme").title = dark ? "Açık moda geç" : "Koyu moda geç";
}
$("btnTheme").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("yaver-theme", next); } catch (e) {}
  renderThemeBtn();
});
renderThemeBtn();

let agents = [], states = {}, finished = false;
// Paralel düğüm adı → dalları (workflow_started'dan gelir; yoksa boş = hepsi sıralı)
let parallelGroups = {};
// Bekleyen onay akışı bitirecek mi (ajan "kod değişikliği gerekmiyor" dedi mi)
let approvalEndsFlow = false;
// Çalışan ajanların başlangıç zamanı — pipeline düğümünde canlı süre göstermek için
let runningSince = {};
let pipelineTicker = null;

// M3 ripple: butonlar/oturum satırları gibi tıklanabilir öğeler için işaretçi
// konumundan büyüyüp sönen katman. innerHTML ile yeniden çizilen öğeler için
// (oturum listesi, ajan hattı) tek seferlik document delegasyonu yeterli —
// aynı yaklaşım approvalText/sidebarBody click delegasyonunda zaten kullanılıyor.
document.addEventListener("pointerdown", (ev) => {
  const el = ev.target.closest("button, .sess");
  if (!el || el.disabled) return;
  el.style.position ||= "relative";
  if (getComputedStyle(el).overflow !== "hidden") el.style.overflow = "hidden";
  const r = el.getBoundingClientRect();
  const span = document.createElement("span");
  span.className = "md-ripple";
  const size = Math.max(r.width, r.height) * 2;
  span.style.width = span.style.height = size + "px";
  span.style.left = (ev.clientX - r.left - size / 2) + "px";
  span.style.top = (ev.clientY - r.top - size / 2) + "px";
  el.appendChild(span);
  span.addEventListener("animationend", () => span.remove());
});

const stateLabels = { pending: "bekliyor", running: "çalışıyor", done: "tamamlandı", rejected: "reddetti" };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function trunc(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function time(ts) { return new Date(ts).toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit", second:"2-digit" }); }
// Tam tarih: gün.ay.yıl saat:dakika (Türkçe biçim)
function fmt(ms) { return new Date(ms).toLocaleString("tr-TR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }); }

let countdownTimer = null;
function startCountdown(agent, runAt) {
  stopCountdown();
  const tick = () => {
    let ms = runAt - Date.now();
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const dd = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600);
    const mm = Math.floor((s % 3600) / 60), ss = s % 60;
    const pad = (n) => String(n).padStart(2, "0");
    const kalan = (dd > 0 ? dd + "g " : "") + `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
    $("scheduleTitle").textContent = `${agent} → ${fmt(runAt)} · kalan ${kalan}`;
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}
function stopCountdown() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}

// Bir hunk'ta before/after arasında GERÇEKTEN değişen kelimeleri işaretlemek için
// kelime bazlı LCS. Kütüphanesiz: before artık kısa bir çapa olduğundan O(n*m) DP
// fazlasıyla yeterli; yine de büyük girdide (ör. after'a konan dosya iskeleti)
// tabloyu hiç kurmayıp düz metne düşeriz.
const CHG_MAX_TOKENS = 400;
const tokenize = (s) => s.match(/\s+|\S+/g) || [];
// Boşluğu işaretlemek görsel gürültü yaratır — sadece gerçek kelimeler vurgulanır
const chg = (t) => (/^\s+$/.test(t) ? esc(t) : `<span class="chg">${esc(t)}</span>`);

function markChanged(before, after) {
  const duz = [esc(before), esc(after)];
  // Tek taraflı (create/delete): zaten tamamı yeni ya da tamamı silinmiş — vurgu anlamsız
  if (!before || !after) return duz;
  const a = tokenize(before), b = tokenize(after);
  if (a.length > CHG_MAX_TOKENS || b.length > CHG_MAX_TOKENS) return duz;

  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }

  const outA = [], outB = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { outA.push(esc(a[i])); outB.push(esc(b[j])); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) outA.push(chg(a[i++]));
    else outB.push(chg(b[j++]));
  }
  while (i < n) outA.push(chg(a[i++]));
  while (j < m) outB.push(chg(b[j++]));
  return [outA.join(""), outB.join("")];
}

// Architect'in file_plan'i veya developer'ın changes'ı diff gibi render edilir.
// Tanınmayan yapı (örn. reviewer kararı) için null döner.
// commentable=true (sadece onay kartı) her hunk'ın altına yorum kutusu ekler.
function renderDiff(structured, commentable) {
  if (!structured || typeof structured !== "object") return null;
  const files = structured.file_plan || structured.changes;
  if (!Array.isArray(files) || files.length === 0) return null;

  const html = files.map((f) => {
    const path = f.path || f.file || "?";
    const hunks = f.changes || f.hunks || [];
    if (!Array.isArray(hunks)) return "";
    const act = f.action ? `<span class="act ${esc(f.action)}">${esc(f.action)}</span>` : "";
    const sum = f.summary ? `<span class="diff-fsum">${esc(f.summary)}</span>` : "";
    const body = hunks.map((h) => {
      const loc = h.location ? `<div class="loc">@ ${esc(h.location)}</div>` : "";
      const [bHtml, aHtml] = markChanged(h.before || "", h.after || "");
      const before = h.before ? `<div class="before"><pre>${bHtml}</pre></div>` : "";
      const after = h.after ? `<div class="after"><pre>${aHtml}</pre></div>` : "";
      // Yan yana: tek taraf varsa (create/delete) o taraf tüm genişliği alır
      const sides = before || after ? `<div class="sides">${before}${after}</div>` : "";
      const why = h.rationale ? `<div class="why">${esc(h.rationale)}</div>` : "";
      // Yorum çapası: dosya yolu + location. Kodu tekrar göndermiyoruz —
      // ajan zaten kendi planındaki parçayı bu iki bilgiyle buluyor.
      const cmt = commentable
        ? `<div class="hcmt"><button type="button" class="hcmt-toggle">💬 yorum</button>` +
          `<textarea class="hcmt-box hidden" rows="1" placeholder="Bu parçaya yorumun…" ` +
          `data-path="${esc(path)}" data-loc="${esc(h.location || "")}"></textarea></div>`
        : "";
      return `<div class="hunk">${loc}${sides}${why}${cmt}</div>`;
    }).join("");
    return `<div class="diff-file"><div class="diff-fhead">${act}<code>${esc(path)}</code>${sum}</div>${body}</div>`;
  }).join("");

  return html || null;
}

// Ölçüm biçimlendirme. DİKKAT: burada bilerek YAPILMAYAN iki şey var —
// (1) turns'ü "retry oldu" diye yorumlamıyoruz: araç çağıran ajan zaten çok turlu;
// (2) inputTokens/contextWindow'dan "%doluluk" çıkarmıyoruz: inputTokens koşu
//     boyunca toplamdır, anlık context değil — çok turlu koşuda %100'ü aşar.
const tok = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));

function fmtMetrics(m) {
  const sn = (ms) => (ms / 1000).toFixed(1) + "sn";
  const parts = [
    `${sn(m.durationMs)} (API ${sn(m.apiDurationMs)})`,
    `${m.turns} tur`,
    `${tok(m.inputTokens)} girdi / ${tok(m.outputTokens)} çıktı`,
  ];
  if (m.cacheReadTokens) parts.push(`${tok(m.cacheReadTokens)} önbellek`);
  if (m.costUsd > 0) parts.push("$" + m.costUsd.toFixed(4));
  return parts.join(" · ");
}

/**
 * Onay kartındaki diff boş ya da kısmi geldiğinde NEDENİNİ yazar. Panel bir şey
 * kaybetmiyor — koşu kayıtlarına göre vakaların bir kısmında model şemayı
 * dolduruyor ama içini boş bırakıyor; bu ikisini ayırt ettirir.
 */
function outputNotice(structured, diff) {
  const kutu = (html) => `<div class="notice"><span>⚠</span><span>${html}</span></div>`;
  if (structured === undefined || structured === null) {
    return kutu("Yapılandırılmış çıktı gelmedi (şema bozulmuş) — aşağıda ajanın ham metni var.");
  }
  const files = structured.file_plan || structured.changes;
  if (!Array.isArray(files) || files.length === 0) {
    return kutu("Ajan somut değişiklik üretmedi — <code>file_plan</code> boş geldi.");
  }
  const hunks = files.flatMap((f) => (Array.isArray(f.changes) ? f.changes : f.hunks) || []);
  if (hunks.length === 0) {
    return kutu(`${files.length} dosya listelenmiş ama değişiklik parçası yok — gösterilecek kod gelmedi.`);
  }
  if (!hunks.some((h) => (h.before || "").trim() || (h.after || "").trim())) {
    return kutu("Değişiklik parçaları kodsuz geldi (<code>before</code>/<code>after</code> boş) — sadece konum ve gerekçe var.");
  }
  return "";
}

function rawJsonDetails(structured) {
  return `<details class="rawjson"><summary>Ham JSON</summary><pre>${esc(JSON.stringify(structured, null, 2))}</pre></details>`;
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  const map = { run:["var(--blueBg)","var(--blue)"], ok:["var(--tealBg)","var(--teal)"], err:["var(--redBg)","var(--red)"], warn:["var(--amberBg)","var(--amber)"] };
  const [bg, fg] = map[kind] || map.run;
  el.style.background = bg; el.style.color = fg;
}

// Saniyeyi "12sn" / "1dk 05sn" biçiminde okunur hale getirir
function fmtElapsed(sec) {
  if (sec < 60) return `${sec}sn`;
  const dk = Math.floor(sec / 60), kalan = sec % 60;
  return `${dk}dk ${String(kalan).padStart(2, "0")}sn`;
}

function isParallelBranch(a) {
  return Object.values(parallelGroups).some((bs) => bs.includes(a));
}

function nodeCell(a) {
  const st = states[a] || "pending";
  let sub = stateLabels[st];
  if (st === "running" && runningSince[a]) {
    sub = `${sub} · ${fmtElapsed(Math.floor((Date.now() - runningSince[a]) / 1000))}`;
  }
  return `<div class="node ${st}"><div class="nm">${esc(a)}</div><div class="sub">${sub}</div></div>`;
}

function renderPipeline() {
  // Bir paralel düğümün dalları hatta TEK hücre olarak çıkar: ilk dalın yerinde
  // grup çizilir, grubun diğer dalları atlanır. Böylece sıra "architect → developer
  // → [güvenlik|test|üslup] → stage" gibi okunur.
  const groupOf = {};                      // dal adı → paralel düğüm adı
  for (const [node, branches] of Object.entries(parallelGroups)) {
    for (const b of branches) groupOf[b] = node;
  }
  const drawn = new Set();
  const cells = [];
  for (const a of agents) {
    const g = groupOf[a];
    if (!g) { cells.push(nodeCell(a)); continue; }
    if (drawn.has(g)) continue;
    drawn.add(g);
    const inner = parallelGroups[g].filter((b) => agents.includes(b)).map(nodeCell).join("");
    cells.push(`<div class="node group"><div class="glabel">${esc(g)} · eş zamanlı</div>${inner}</div>`);
  }
  $("pipeline").innerHTML = cells.join('<div class="arrow">→</div>');
}

// Çalışan ajan varken saniyede bir pipeline'ı yeniden çizer; kimse çalışmıyorsa durur
function ensurePipelineTicker() {
  if (pipelineTicker) return;
  pipelineTicker = setInterval(() => {
    if (Object.keys(runningSince).length === 0) {
      clearInterval(pipelineTicker);
      pipelineTicker = null;
      return;
    }
    renderPipeline();
  }, 1000);
}

function stopPipelineTicker() {
  if (pipelineTicker) {
    clearInterval(pipelineTicker);
    pipelineTicker = null;
  }
  runningSince = {};
}

let buildOrder = [], buildStates = {};
function renderBuild() {
  $("buildModules").innerHTML = buildOrder.map((m) => {
    const st = buildStates[m] || "";
    return `<div class="bnode ${st}">${esc(m)}</div>`;
  }).join('<div class="arrow">→</div>');
}
function resetBuild() {
  buildOrder = []; buildStates = {};
  $("buildCard").classList.add("hidden");
  $("buildLog").textContent = "";
}

function addLog(ts, html, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = `<span class="t">${time(ts)}</span>${html}`;
  const s = $("stream");
  s.appendChild(div);
  s.scrollTop = s.scrollHeight;
}

function handle(e) {
  switch (e.type) {
    case "workflow_started":
      agents = e.agents;
      parallelGroups = e.parallelGroups || {};
      states = {};
      agents.forEach((a) => (states[a] = "pending"));
      $("task").textContent = e.task;
      $("provider").textContent = e.provider;
      currentDir = e.targetDir;
      showDirDisplay(currentDir);
      $("cycle").textContent = `tur 0/${e.maxCycles}`;
      if (!e.resumed) $("stream").innerHTML = "";  // resume'da önceki konuşma ekranda kalsın
      $("verdictCard").classList.add("hidden");
      $("approval").classList.add("hidden");
      $("schedule").classList.add("hidden");
      stopCountdown();
      stopPipelineTicker();
      resetBuild();
      $("taskCard").classList.add("hidden");
      finished = false;
      $("btnCancel").classList.remove("hidden");
      setStatus("çalışıyor", "run");
      renderPipeline();
      if (e.resumed) addLog(e.ts, "──────── aynı oturumda yeni görev ────────", "muted");
      addLog(e.ts, "iş akışı başladı");
      break;
    case "agent_started":
      states[e.agent] = "running";
      runningSince[e.agent] = Date.now();
      ensurePipelineTicker();
      renderPipeline();
      addLog(e.ts, `<b>${esc(e.agent)}</b> başladı`);
      break;
    case "agent_text":
      addLog(e.ts, esc(trunc(e.text, 240)), "muted");
      break;
    case "agent_retrying": {
      // Bağlantı koptu — akış ölmedi, bekleyip yeniden deneyecek
      const kac = e.maxAttempts > 0 ? `${e.attempt}/${e.maxAttempts}` : `${e.attempt}`;
      const nasil = e.resumed ? "oturum sürdürülecek" : "oturum baştan";
      addLog(
        e.ts,
        `🔌 <b>${esc(e.agent)}</b> bağlantı koptu — ${Math.round(e.delayMs / 1000)}sn sonra ` +
          `${kac}. deneme (${nasil}): ${esc(trunc(e.error, 160))}`,
        "warn",
      );
      break;
    }
    case "tool_used":
      if (!e.detail) break;
      addLog(e.ts, `⚙ ${esc(e.tool)}: ${esc(e.detail)}`, "muted");
      break;
    case "agent_finished":
      states[e.agent] = "done";
      delete runningSince[e.agent];
      renderPipeline();
      addLog(e.ts, `<b>${esc(e.agent)}</b> bitti`, "ok");
      if (e.metrics) {
        addLog(e.ts, `📊 ${fmtMetrics(e.metrics)}`, "muted");
        // Birden fazla model = arka planda ikinci bir model calismis
        if (e.metrics.perModel && e.metrics.perModel.length > 1) {
          const kirilim = e.metrics.perModel
            .map((p) => `${esc(p.model)}: ${tok(p.inputTokens)}/${tok(p.outputTokens)}`).join(" · ");
          addLog(e.ts, `📊 ${kirilim}`, "muted");
        }
      }
      if (e.structured !== undefined) {
        const d = document.createElement("details");
        d.className = "structured";
        const diff = renderDiff(e.structured);
        const inner = diff ? diff : `<pre>${esc(JSON.stringify(e.structured, null, 2))}</pre>`;
        d.innerHTML = `<summary>${esc(e.agent)} yapılandırılmış çıktısı</summary>${inner}`;
        const s = $("stream");
        s.appendChild(d);
        s.scrollTop = s.scrollHeight;
      }
      break;
    case "approval_required": {
      // endsFlow: ajan "kod değişikliği gerekmiyor" dedi — onay akışı bitirir,
      // red ise gerekçeyle yeniden planlatır. Zamanlama burada anlamsız, gizlenir.
      $("approvalTitle").textContent = e.endsFlow
        ? `${e.agent} kod değişikliği gerekmediğini söylüyor`
        : `${e.agent} çıktısı onayını bekliyor`;
      approvalEndsFlow = !!e.endsFlow;
      $("btnApprove").textContent = e.endsFlow ? "Bitir" : "Onayla";
      $("rejectComment").placeholder = e.endsFlow
        ? "Neden gerekli? (isteğe bağlı)"
        : "Red gerekçesi (isteğe bağlı)";
      $("when").classList.toggle("hidden", !!e.endsFlow);
      const diff = renderDiff(e.structured, true);
      const uyari = outputNotice(e.structured, diff);
      const lead = e.structured && e.structured.summary
        ? `<p class="lead">${esc(e.structured.summary)}</p>`
        : "";
      if (diff) {
        $("approvalText").innerHTML = uyari + lead + diff + rawJsonDetails(e.structured);
      } else if (e.structured) {
        // Şema geldi ama içi boş: ham metin JSON'un kendisi olurdu — özet + ham JSON yeter
        $("approvalText").innerHTML = uyari + lead + rawJsonDetails(e.structured);
      } else {
        $("approvalText").innerHTML = uyari + `<pre>${esc(trunc(e.output, 4000))}</pre>`;
      }
      updateRejectLabel();
      resetWhen();
      $("approval").classList.remove("hidden");
      setStatus("onay bekliyor", "warn");
      addLog(e.ts, `${esc(e.agent)} onay bekliyor`, "warn");
      break;
    }
    case "approval_resolved":
      $("approval").classList.add("hidden");
      setStatus("çalışıyor", "run");
      addLog(e.ts, `onay: ${e.approved ? "verildi" : "reddedildi"} (${e.source})${e.comment ? " — " + esc(e.comment) : ""}`, e.approved ? "ok" : "err");
      break;
    case "verdict": {
      states[e.agent] = e.approved ? "done" : "rejected";
      renderPipeline();
      addLog(e.ts, `<b>${esc(e.agent)}</b> kararı: ${e.approved ? "onay" : "red"} — ${esc(e.summary)}`,
        e.approved ? "ok" : "err");
      // Paralel dalsa karar kartını DOLDURMA: üç dal sırayla birbirini ezerdi.
      // Kartı birleşmiş sonuçla parallel_finished dolduruyor.
      if (isParallelBranch(e.agent)) break;
      $("verdictCard").classList.remove("hidden");
      const head = $("verdictHead");
      head.textContent = e.approved ? "Onaylandı" : "Reddedildi";
      head.style.color = e.approved ? "var(--teal)" : "var(--red)";
      $("verdictSummary").textContent = e.summary;
      $("issues").innerHTML = e.issues.map((i) =>
        `<div class="issue"><span class="sev ${i.severity}">${i.severity}</span><span>${esc(i.file)} — ${esc(i.description)}</span></div>`
      ).join("") || '<div style="font-size:13px;color:var(--muted)">Sorun bildirilmedi</div>';
      break;
    }
    case "parallel_started":
      addLog(e.ts, `⚡ paralel inceleme başladı: ${e.branches.map(esc).join(", ")}`);
      break;
    case "parallel_finished": {
      // Dal durumlarını birleşik sonuçtan kesinleştir. Hata veren dal hiç verdict
      // yayınlamaz — düzeltmezsek şeritte sonsuza kadar "çalışıyor" görünürdü.
      for (const b of e.branches) {
        states[b.branch] = b.ok && b.approved ? "done" : "rejected";
        delete runningSince[b.branch];
      }
      renderPipeline();
      // Birleşmiş karar: dallardan biri bile reddettiyse ya da inceleyemediyse red
      $("verdictCard").classList.remove("hidden");
      const head = $("verdictHead");
      head.textContent = e.approved ? "Onaylandı" : "Reddedildi";
      head.style.color = e.approved ? "var(--teal)" : "var(--red)";
      const cost = e.costUsd ? ` · toplam $${e.costUsd.toFixed(4)}` : "";
      $("verdictSummary").textContent =
        `${e.branches.length} dal eş zamanlı inceledi${cost}`;
      // Sorunlar dal başlığı altında gruplu — hangi uzmanlığın itiraz ettiği görünsün
      $("issues").innerHTML = e.branches.map((b) => {
        const mark = !b.ok ? "⚠" : b.approved ? "✅" : "❌";
        const color = !b.ok ? "var(--amber)" : b.approved ? "var(--teal)" : "var(--red)";
        const rows = b.issues.map((i) =>
          `<div class="issue"><span class="sev ${i.severity}">${i.severity}</span><span>${esc(i.file)} — ${esc(i.description)}</span></div>`
        ).join("");
        return `<div style="margin-bottom:10px">` +
          `<div style="font-size:12px;font-weight:700;color:${color};margin-bottom:4px">${mark} ${esc(b.branch)}</div>` +
          `<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">${esc(b.summary)}</div>` +
          rows + `</div>`;
      }).join("");
      addLog(e.ts, `paralel karar: ${e.approved ? "onaylandı" : "reddedildi"}${cost}`,
        e.approved ? "ok" : "err");
      break;
    }
    case "cycle":
      $("cycle").textContent = `tur ${e.n}/${e.max}`;
      addLog(e.ts, `tur ${e.n}: sorunlar → ${esc(e.to)}`, "warn");
      break;
    case "build_started":
      buildOrder = e.order; buildStates = {};
      e.order.forEach((m) => (buildStates[m] = ""));
      $("buildLog").textContent = "";
      $("buildCard").classList.remove("hidden");
      renderBuild();
      setStatus("build", "run");
      addLog(e.ts, e.order.length ? `build sırası: ${e.order.map(esc).join(" → ")}` : "build: değişen modül yok", "muted");
      break;
    case "build_module_started":
      buildStates[e.module] = "running";
      renderBuild();
      addLog(e.ts, `🔨 ${esc(e.module)}: ${esc(e.command)}`, "muted");
      break;
    case "build_output": {
      const pre = $("buildLog");
      pre.textContent = (pre.textContent + e.text).slice(-8000);
      pre.scrollTop = pre.scrollHeight;
      break;
    }
    case "build_module_finished":
      buildStates[e.module] = "done";
      renderBuild();
      break;
    case "build_failed":
      buildStates[e.module] = "failed";
      renderBuild();
      setStatus("build hatası", "err");
      addLog(e.ts, `build başarısız: ${esc(e.module)} (çıkış ${e.code})`, "err");
      break;
    case "build_finished":
      addLog(e.ts, `build tamam: ${e.order.map(esc).join(" → ") || "—"}`, "ok");
      break;
    case "run_scheduled":
      $("approval").classList.add("hidden");
      $("schedule").classList.remove("hidden");
      startCountdown(e.agent, e.runAt);
      setStatus("zamanlandı", "warn");
      addLog(e.ts, `${esc(e.agent)} → ${fmt(e.runAt)} için zamanlandı`, "warn");
      break;
    case "run_resumed":
      $("schedule").classList.add("hidden");
      stopCountdown();
      setStatus("çalışıyor", "run");
      addLog(e.ts, `zamanlama tamam (${esc(e.source)}) — devam ediliyor`, "ok");
      break;
    case "run_schedule_cancelled":
      $("schedule").classList.add("hidden");
      stopCountdown();
      setStatus("iptal edildi", "err");
      addLog(e.ts, `zamanlama iptal edildi (${esc(e.source)})`, "err");
      break;
    case "workflow_finished":
      finished = true;
      stopPipelineTicker();
      $("btnCancel").classList.add("hidden");
      setStatus("tamamlandı", "ok");
      addLog(e.ts, "iş akışı tamamlandı 🎉", "ok");
      showTaskCard();
      break;
    case "workflow_cancelled":
      finished = true;
      stopPipelineTicker();
      $("btnCancel").classList.add("hidden");
      $("approval").classList.add("hidden");
      $("schedule").classList.add("hidden");
      stopCountdown();
      setStatus("iptal edildi", "err");
      addLog(e.ts, "iş akışı iptal edildi 🛑", "err");
      showTaskCard();
      break;
    case "workflow_failed":
      finished = true;
      stopPipelineTicker();
      $("btnCancel").classList.add("hidden");
      setStatus("hata", "err");
      addLog(e.ts, esc(e.error), "err");
      showTaskCard();
      break;
  }
}

// datetime-local input'un beklediği yerel biçim: YYYY-MM-DDTHH:MM
function toLocalInput(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// "Belirli tarih/saat…" seçilince native picker'ı göster, alt sınırı ve
// varsayılanı (şimdi+1 saat) ayarla
$("whenPreset").addEventListener("change", () => {
  const custom = $("whenPreset").value === "custom";
  $("whenCustom").classList.toggle("hidden", !custom);
  if (custom && !$("whenCustom").value) {
    const now = new Date();
    $("whenCustom").min = toLocalInput(now);
    $("whenCustom").value = toLocalInput(new Date(now.getTime() + 3600000));
  }
});

// Seçilen zamandan epoch ms üretir; "hemen" ya da geçersizse undefined döner
function selectedRunAt() {
  const preset = $("whenPreset").value;
  if (preset === "0") return undefined;
  if (preset === "custom") {
    const v = $("whenCustom").value;
    const t = v ? new Date(v).getTime() : NaN;
    return Number.isFinite(t) && t > Date.now() ? t : undefined;
  }
  const offsets = { "30m": 1800000, "1h": 3600000, "3h": 10800000, "1d": 86400000 };
  return Date.now() + offsets[preset];
}

function resetWhen() {
  $("whenPreset").value = "0";
  $("whenCustom").value = "";
  $("whenCustom").classList.add("hidden");
}

// Diff'teki hunk yorumlarını topla: [{path, loc, text}]
function hunkComments() {
  return [...$("approvalText").querySelectorAll(".hcmt-box")]
    .map((el) => ({ path: el.dataset.path, loc: el.dataset.loc, text: el.value.trim() }))
    .filter((c) => c.text);
}

// Red gerekçesi = genel kutu + hunk yorumları (ikisi de isteğe bağlı).
// Ajana giden metin ctx.feedback olarak aynen prompt'a girer, kısa tutuyoruz.
function buildRejectComment() {
  const genel = $("rejectComment").value.trim();
  const cmts = hunkComments();
  const parts = [];
  if (genel) parts.push(`Genel: ${genel}`);
  for (const c of cmts) {
    const bas = c.loc ? `${c.path} @ ${c.loc}` : c.path;
    parts.push(`${bas}:\n- ${c.text.replace(/\n/g, "\n- ")}`);
  }
  return parts.join("\n\n");
}

function updateRejectLabel() {
  const n = hunkComments().length;
  // endsFlow'da "Reddet" yanıltıcı: reddedilen bir çıktı değil, "gerek yok" kararı
  const base = approvalEndsFlow ? "Hayır, yeniden planla" : "Reddet";
  $("btnReject").textContent = n ? `${base} (${n} yorum)` : base;
}

// Yorum kutuları diff yeniden çizildiğinde kaybolduğu için olay delegasyonu
$("approvalText").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".hcmt-toggle");
  if (!btn) return;
  const box = btn.parentElement.querySelector(".hcmt-box");
  // Doluysa kapatmıyoruz: gizli ama sayılan yorum kafa karıştırır
  if (box.value.trim()) { box.focus(); return; }
  const acildi = box.classList.toggle("hidden") === false;
  if (acildi) { autoGrow(box); box.focus(); }
});
$("approvalText").addEventListener("input", (ev) => {
  const box = ev.target.closest(".hcmt-box");
  if (!box) return;
  autoGrow(box);
  box.closest(".hunk").classList.toggle("has-cmt", Boolean(box.value.trim()));
  updateRejectLabel();
});

async function sendApproval(approved) {
  const comment = approved ? "" : buildRejectComment();
  const runAt = approved ? selectedRunAt() : undefined;
  await fetch("/approval", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      approved,
      comment: approved ? undefined : comment,
      runAt,
    }),
  });
  $("rejectComment").value = "";
  autoGrow($("rejectComment"));
  // Yorumlar gönderildi: kutuları boşalt (yeni plan geldiğinde diff zaten yeniden çizilir)
  for (const box of $("approvalText").querySelectorAll(".hcmt-box")) {
    box.value = "";
    box.classList.add("hidden");
    box.closest(".hunk").classList.remove("has-cmt");
  }
  updateRejectLabel();
  resetWhen();
}
$("btnApprove").addEventListener("click", () => sendApproval(true));
$("btnReject").addEventListener("click", () => sendApproval(false));

async function sendSchedule(action) {
  await fetch("/schedule", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ action }),
  });
}
$("btnRunNow").addEventListener("click", () => sendSchedule("run"));
$("btnCancelSchedule").addEventListener("click", () => sendSchedule("cancel"));

async function sendCancel() {
  $("btnCancel").disabled = true;
  try {
    await fetch("/cancel", { method: "POST" });
  } finally {
    $("btnCancel").disabled = false;
  }
}
$("btnCancel").addEventListener("click", sendCancel);

// ── Oturum listesi (sol kenar çubuğu) ──────────────────────────────
let selectedSessionId = "";   // "" = yeni oturum
let sessionNames = {};        // id -> isim (taskCtx için)

function updateTaskCtx() {
  const el = $("taskCtx");
  if (!el) return;
  el.textContent = selectedSessionId
    ? `↩ Sürdürülecek oturum: ${sessionNames[selectedSessionId] || selectedSessionId}`
    : "＋ Yeni oturum başlatılacak";
}
function selectSession(id) {
  selectedSessionId = id || "";
  document.querySelectorAll("#sidebarBody .sess").forEach((n) =>
    n.classList.toggle("active", (n.dataset.id || "") === selectedSessionId));
  updateTaskCtx();
}
async function loadSessions() {
  let list = [];
  try { list = await (await fetch("/sessions")).json(); } catch {}
  sessionNames = {};
  list.forEach((s) => (sessionNames[s.id] = s.name));
  $("sessionList").innerHTML = list.map((s) =>
    `<div class="sess" data-id="${esc(s.id)}"><div class="sess-main"><div class="nm">${esc(s.name)}</div><div class="meta">${fmt(Date.parse(s.updatedAt))}</div></div><button class="sess-del" data-del="${esc(s.id)}" title="Oturumu listeden sil">×</button></div>`
  ).join("");
  if (selectedSessionId && !sessionNames[selectedSessionId]) selectedSessionId = "";
  selectSession(selectedSessionId);
}
async function removeSession(id) {
  const name = sessionNames[id] || id;
  if (!confirm(`"${name}" oturumu silinsin mi?\n(Sadece listeden kaldırılır; konuşma diskte kalır.)`)) return;
  try { await fetch("/session-delete", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ id }) }); } catch {}
  if (selectedSessionId === id) selectedSessionId = "";
  loadSessions();
}
$("sidebarBody").addEventListener("click", (ev) => {
  const delBtn = ev.target.closest(".sess-del");
  if (delBtn) { removeSession(delBtn.dataset.del); return; }
  const el = ev.target.closest(".sess");
  if (el) selectSession(el.dataset.id || "");
});
$("btnSidebar").addEventListener("click", () => {
  const collapsed = $("sidebar").classList.toggle("collapsed");
  $("btnSidebar").textContent = collapsed ? "☰" : "⟨";
});
loadSessions();

// Hedef proje dizini: config.json'ı elle açmak yerine panelden değiştirilir —
// tıkla → metin kutusu, Enter kaydeder (sunucuda doğrulanır + config.json'a yazılır)
let currentDir = "";
function showDirDisplay(text) {
  $("dir").textContent = text;
  $("dir").classList.remove("hidden");
  $("dirInput").classList.add("hidden");
}
function showDirEditor() {
  $("dirInput").value = currentDir;
  $("dir").classList.add("hidden");
  $("dirInput").classList.remove("hidden");
  $("dirInput").focus();
  $("dirInput").select();
}
async function saveDir() {
  const val = $("dirInput").value.trim();
  if (!val || val === currentDir) { showDirDisplay(currentDir); return; }
  try {
    const res = await fetch("/target-dir", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ dir: val }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.ok) {
      currentDir = data.dir || val;
      showDirDisplay(currentDir);
      addLog(new Date().toISOString(), `📁 hedef dizin değiştirildi: ${esc(currentDir)}`, "ok");
    } else {
      alert(data.error || "hedef dizin kaydedilemedi");
      showDirEditor();
    }
  } catch {
    alert("hedef dizin kaydedilemedi");
    showDirEditor();
  }
}
$("dir").addEventListener("click", showDirEditor);
$("dirInput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); saveDir(); }
  else if (ev.key === "Escape") { showDirDisplay(currentDir); }
});
$("dirInput").addEventListener("blur", () => showDirDisplay(currentDir));
async function loadTargetDir() {
  try {
    const data = await (await fetch("/target-dir")).json();
    currentDir = data.dir || "";
    showDirDisplay(currentDir);
  } catch {}
}
loadTargetDir();

// Model seçimi: liste config'teki modelsUrl'den sunucu üzerinden çekilir (API
// anahtarı tarayıcıya hiç gelmez). Seçim config.json'a yazılır, sıradaki görev kullanır.
let currentModel = "";
function fillModelSelect(models, error) {
  const sel = $("modelSel");
  const opts = [`<option value="">model: varsayılan</option>`];
  const ids = new Set(models.map((m) => m.id));
  // Config'teki model listede yoksa da görünsün (API düşük/eski kayıt)
  if (currentModel && !ids.has(currentModel)) {
    opts.push(`<option value="${esc(currentModel)}">${esc(currentModel)}</option>`);
  }
  for (const m of models) {
    const label = m.name && m.name !== m.id ? `${m.name} (${m.id})` : m.id;
    opts.push(`<option value="${esc(m.id)}">${esc(label)}</option>`);
  }
  sel.innerHTML = opts.join("");
  sel.value = currentModel;
  sel.title = error ? `Model listesi alınamadı: ${error}` : "Model — sıradaki görevde kullanılır";
  sel.style.borderColor = error ? "var(--red)" : "";
}
async function loadModels() {
  try {
    const data = await (await fetch("/models")).json();
    currentModel = data.current || "";
    fillModelSelect(data.models || [], data.error);
  } catch {
    fillModelSelect([], "sunucuya ulaşılamadı");
  }
}
$("modelSel").addEventListener("change", async () => {
  const model = $("modelSel").value;
  try {
    const res = await fetch("/model", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ model }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.ok) {
      currentModel = model;
      addLog(new Date().toISOString(), `🧠 model değiştirildi: ${esc(model || "varsayılan")} — sıradaki görevde geçerli`, "ok");
    } else {
      alert(data.error || "model kaydedilemedi");
      $("modelSel").value = currentModel;
    }
  } catch {
    alert("model kaydedilemedi");
    $("modelSel").value = currentModel;
  }
});
loadModels();

function showTaskCard() {
  $("taskCard").classList.remove("hidden");
  $("taskError").textContent = "";
  updateTaskCtx();
  autoGrow($("taskInput"));
  $("taskInput").focus();
  // Koşu bittiyse yeni oturum katalogda görünene dek kısa bir gecikmeyle tazele
  setTimeout(loadSessions, 400);
}

async function startTask() {
  const task = $("taskInput").value.trim();
  if (!task) return;
  const res = await fetch("/task", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ task, resumeSessionId: selectedSessionId || undefined }),
  });
  const data = await res.json().catch(() => ({}));
  if (data.ok) {
    $("taskInput").value = "";
    autoGrow($("taskInput"));
    $("taskError").textContent = "";
  } else {
    $("taskError").textContent = data.error || "görev başlatılamadı";
  }
}
$("btnStart").addEventListener("click", startTask);
// Enter gönderir, Shift+Enter yeni satır açar
$("taskInput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); startTask(); }
});

// Metin alanını içeriğe göre alta doğru büyüt (CSS max-height'a kadar)
function autoGrow(el) {
  if (el.offsetParent === null) return; // kart gizliyken ölçüm 0 gelir
  el.style.height = "auto"; // rows=1 taban yüksekliği
  if (!el.value) return;    // boşken placeholder scrollHeight'ı şişirir
  // border-box olduğu için scrollHeight'a kenarlık payını ekle
  el.style.height = el.scrollHeight + (el.offsetHeight - el.clientHeight) + "px";
}
for (const id of ["taskInput", "rejectComment"]) {
  const el = $(id);
  el.addEventListener("input", () => autoGrow(el));
  autoGrow(el);
}

let sawAnyEvent = false;
const es = new EventSource("/events");
es.onmessage = (m) => { sawAnyEvent = true; handle(JSON.parse(m.data)); };
es.onopen = () => {
  // Sunucu modunda henüz koşu yoksa görev girişini göster
  setTimeout(() => {
    if (!sawAnyEvent) { $("task").textContent = "görev bekleniyor"; setStatus("hazır", "ok"); showTaskCard(); }
  }, 400);
};
es.onerror = () => {
  if (finished) { es.close(); $("taskCard").classList.add("hidden"); return; }
  setStatus("bağlantı koptu", "err");
};
</script>
