<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="yaver">
  <title>yaver</title>
  <!-- Kenetlenen eller: kavramak için kıvrılmış iki açık el (~265°'lik yay,
       95°'lik ağız). Her elin parmak uçları (yuvarlak kapaklar) karşı elin
       gövdesini geçerek kavrar. Alt kesişimde mavi el teal'in ÜSTÜNDEN, üst
       kesişimde teal mavinin üstünden geçer — bu örgü olmasa şekil "üst üste
       binmiş iki halka" gibi okunurdu; kenetlenme hissini veren bu.
       Grup -45° döndürüldü: kavrama çapraz durur (kol kavrayışı gibi) ve kare
       kutuyu doldurur. Renkler marka mavisi/teal'in ara tonları — logo <img>
       ile gömüldüğü için CSS değişkeni göremez, bu yüzden hem açık (#E4E8F0)
       hem koyu (#282A2F) üst şerit yüzeyinde >=3:1 kontrast veren tonlar. -->
  <g fill="none" stroke-width="3.6" stroke-linecap="round" transform="rotate(-45 16 16)">
    <path d="M 16.79 20.79 A 6.5 6.5 0 1 1 16.79 11.21" stroke="#3D82C9"/>
    <path d="M 15.21 11.21 A 6.5 6.5 0 1 1 15.21 20.79" stroke="#17917A"/>
    <!-- mavi elin alt kesişimdeki parçası, örgüyü kapatmak için en üstte -->
    <path d="M 16.67 20.91 A 6.5 6.5 0 0 1 15.04 21.94" stroke="#3D82C9"/>
  </g>
</svg>
